services:
  practice:
    image: ${IMAGE:-ghcr.io/paimoncai/study-econ:latest}
    pull_policy: always
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SITE_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      BASE_PATH: ${BASE_PATH:-}
      STORAGE_MODE: server
      DATA_DIR: /app/data
      ACCESS_REQUIRED: "true"
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      ACCESS_COOKIE_SECURE: ${ACCESS_COOKIE_SECURE:-false}
      ACCESS_SESSION_HOURS: ${ACCESS_SESSION_HOURS:-168}
    volumes:
      - study-data:/app/data
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  study-data:
