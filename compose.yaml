services:
  practice:
    image: ${IMAGE:-ghcr.io/paimoncai/study-econ:latest}
    pull_policy: always
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${SITE_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      BASE_PATH: ${BASE_PATH:-}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
