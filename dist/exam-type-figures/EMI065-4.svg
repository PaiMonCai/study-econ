<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 499" role="img" aria-labelledby="EMI065-4-title EMI065-4-desc"><title id="EMI065-4-title">同一企业的原长期与工资冲击后均衡</title><desc id="EMI065-4-desc">横轴为单厂产量，不是行业总量。原工资4时长期平均成本最低点为(1350,60)；工资升至13.5、原资本13500固定时，新短期边际成本通过(900,90)，也通过新长期平均成本最低点。行业需求Q=1620000/p和企业20家还须另行出清。本例短期等于新长期具有特定结构条件，改变需求弹性后不能沿用。</desc><rect width="520" height="499" fill="white"/><defs><clipPath id="EMI065-4-clip"><rect x="58" y="30" width="410" height="335"/></clipPath><marker id="EMI065-4-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#183347"/></marker></defs><g font-family="Georgia,Songti SC,SimSun,serif" font-size="18"><path d="M160.5,365V30" stroke="#e3e9ec"/><text x="160.5" y="391" text-anchor="middle" fill="#183347">450</text><path d="M263,365V30" stroke="#e3e9ec"/><text x="263" y="391" text-anchor="middle" fill="#183347">900</text><path d="M365.5,365V30" stroke="#e3e9ec"/><text x="365.5" y="391" text-anchor="middle" fill="#183347">1350</text><path d="M468,365V30" stroke="#e3e9ec"/><text x="468" y="391" text-anchor="middle" fill="#183347">1800</text><path d="M58,314.75H468" stroke="#e3e9ec"/><text x="46" y="320.75" text-anchor="end" fill="#183347">30</text><path d="M58,264.5H468" stroke="#e3e9ec"/><text x="46" y="270.5" text-anchor="end" fill="#183347">60</text><path d="M58,214.25H468" stroke="#e3e9ec"/><text x="46" y="220.25" text-anchor="end" fill="#183347">90</text><path d="M58,164H468" stroke="#e3e9ec"/><text x="46" y="170" text-anchor="end" fill="#183347">120</text><path d="M58,113.75H468" stroke="#e3e9ec"/><text x="46" y="119.75" text-anchor="end" fill="#183347">150</text><path d="M58,63.5H468" stroke="#e3e9ec"/><text x="46" y="69.5" text-anchor="end" fill="#183347">180</text><path d="M58,22V365H480" fill="none" stroke="#183347" stroke-width="1.8"/><text x="494" y="370" text-anchor="start" fill="#183347">q</text><text x="53" y="17" text-anchor="middle" fill="#183347">p</text><text