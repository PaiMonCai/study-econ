<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 476" role="img" aria-labelledby="EMI068-4-title EMI068-4-desc"><title id="EMI068-4-title">有效排污与先行定价的不同配置</title><desc id="EMI068-4-desc">钢厂边际排污收益（边际减排成本）按排污量为8−2x；渔产最优调整后的边际损害为5−x/2，两者在排污2、价格4相交。渔场先承诺单价并按需求供给时选择44/7、排污6/7，低于联合最优排污。边际损害曲线不自动等于可自由扣留权利的供给曲线；第3问足额拍卖另有明确制度。</desc><rect width="520" height="476" fill="white"/><defs><clipPath id="EMI068-4-clip"><rect x="58" y="30" width="410" height="335"/></clipPath><marker id="EMI068-4-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#183347"/></marker></defs><g font-family="Georgia,Songti SC,SimSun,serif" font-size="18"><path d="M149.1111111111111,365V30" stroke="#e3e9ec"/><text x="149.111" y="391" text-anchor="middle" fill="#183347">1</text><path d="M240.2222222222222,365V30" stroke="#e3e9ec"/><text x="240.222" y="391" text-anchor="middle" fill="#183347">2</text><path d="M331.3333333333333,365V30" stroke="#e3e9ec"/><text x="331.333" y="391" text-anchor="middle" fill="#183347">3</text><path d="M422.4444444444444,365V30" stroke="#e3e9ec"/><text x="422.444" y="391" text-anchor="middle" fill="#183347">4</text><path d="M58,290.55555555555554H468" stroke="#e3e9ec"/><text x="46" y="296.556" text-anchor="end" fill="#183347">2</text><path d="M58,216.11111111111111H468" stroke="#e3e9ec"/><text x="46" y="222.111" text-anchor="end" fill="#183347">4</text><path d="M58,141.66666666666669H468" stroke="#e3e9ec"/><text x="46" y="147.667" text-anchor="end" fill="#183347">6</text><path d="M58,67.22222222222223H468" stroke="#e3e9ec"/><text x="46" y="73.222" text-anchor="end" fill="#183347">8</text><path d="M58,22V365H480" fill="none" stroke="#183347" stroke-width="1.8"/><text x="494" y="370" text-anchor="start" fill="#183347">x</text><text x="53" y="17" text-anchor="middle" fill="#183347">价</text><text x="46" y="391" text-anchor="middle" fill="#183347">0</text><g clip-path="url(#EMI068-4-clip)"><path d="M58,67.222 L422.444,365" f