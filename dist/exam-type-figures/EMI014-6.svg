<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 453" role="img" aria-labelledby="EMI014-6-title EMI014-6-desc"><title id="EMI014-6-title">一般劳动供给先上升、再后弯的条件</title><desc id="EMI014-6-desc">完整曲线为一般偏好下的机制示意，没有本题效用的数值含义。低工资区替代效应占优时工时上升；高工资区闲暇的收入效应占优时工时下降。后弯并非每种偏好必然出现，原ln(c−16)+ln l模型只展示后弯分支。</desc><rect width="520" height="453" fill="white"/><defs><clipPath id="EMI014-6-clip"><rect x="58" y="30" width="410" height="335"/></clipPath><marker id="EMI014-6-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#183347"/></marker></defs><g font-family="Georgia,Songti SC,SimSun,serif" font-size="18"><path d="M58,22V365H480" fill="none" stroke="#183347" stroke-width="1.8"/><text x="494" y="370" text-anchor="start" fill="#183347">h</text><text x="53" y="17" text-anchor="middle" fill="#183347">w</text><text x="46" y="391" text-anchor="middle" fill="#183347">0</text><g clip-path="url(#EMI014-6-clip)"><path d="M122.95,358.909 L148.59,356.422 L173.366,353.935 L197.075,351.448 L219.544,348.961 L240.636,346.473 L260.247,343.986 L278.31,341.499 L294.787,339.012 L309.675,336.525 L322.992,334.038 L334.781,331.551 L345.1,329.064 L354.024,326.577 L361.633,324.089 L368.018,321.602 L373.268,319.115 L377.478,316.628 L380.739,314.141 L383.138,311.654 L384.762,309.167 L385.691,306.68 L386,304.192 L385.758,301.705 L385.031,299.218 L383.877,296.731 L382.351,294.244 L380.501,291.757 L378.371,289.27 L376.002,286.783 L373.428,284.295 L370.681,281.808 L367.789,279.321 L364.779,276.834 L361.672,274.347 L358.488,271.86 L355.244,269.373 L351.956,266.886 L348.636,264.398 L345.298,261.911 L341.951,259.424 L338.604,256.937 L335.265,254.45 L331.941,251.963 L328.637,249.476 L325.359,246.989 L322.11,244.502 L318.895,242.014 L315.716,239.527 L312.576,237.04 L309.477,234.553 L306.42,232.066 L303.407,229.579 L300.439,227.092 L297.518,224.605 L294.642,222.117 L291.813,219.63 L289.031,217.143 L286.296,214.656 L283.607,212.169 L280.966,209.682 L278.37,207.19