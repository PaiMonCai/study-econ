<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 559" role="img" aria-labelledby="EMI001-6-title EMI001-6-desc"><title id="EMI001-6-title">一般吉芬偏好的Slutsky分解示意</title><desc id="EMI001-6-desc">另设收入6、x价格由2降到1，A(2,2)、补偿选择C(3,1)、新选择B(1.5,4.5)仅作一般吉芬偏好的机制示意。补偿收入为4。替代效应使x增加1，收入效应使x减少1.5，总效应为−0.5。这不是本题CD效用与收入24下的数值解。</desc><rect width="520" height="559" fill="white"/><defs><clipPath id="EMI001-6-clip"><rect x="58" y="30" width="410" height="335"/></clipPath><marker id="EMI001-6-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#183347"/></marker></defs><g font-family="Georgia,Songti SC,SimSun,serif" font-size="18"><path d="M121.07692307692308,365V30" stroke="#e3e9ec"/><text x="121.077" y="391" text-anchor="middle" fill="#183347">1</text><path d="M184.15384615384616,365V30" stroke="#e3e9ec"/><text x="184.154" y="391" text-anchor="middle" fill="#183347">2</text><path d="M247.23076923076925,365V30" stroke="#e3e9ec"/><text x="247.231" y="391" text-anchor="middle" fill="#183347">3</text><path d="M310.3076923076923,365V30" stroke="#e3e9ec"/><text x="310.308" y="391" text-anchor="middle" fill="#183347">4</text><path d="M373.3846153846154,365V30" stroke="#e3e9ec"/><text x="373.385" y="391" text-anchor="middle" fill="#183347">5</text><path d="M436.4615384615385,365V30" stroke="#e3e9ec"/><text x="436.462" y="391" text-anchor="middle" fill="#183347">6</text><path d="M58,313.46153846153845H468" stroke="#e3e9ec"/><text x="46" y="319.462" text-anchor="end" fill="#183347">1</text><path d="M58,261.9230769230769H468" stroke="#e3e9ec"/><text x="46" y="267.923" text-anchor="end" fill="#183347">2</text><path d="M58,210.3846153846154H468" stroke="#e3e9ec"/><text x="46" y="216.385" text-anchor="end" fill="#183347">3</text><path d="M58,158.84615384615384H468" stroke="#e3e9ec"/><text x="46" y="164.846" text-anchor="end" fill="#183347">4</text><path d="M58,107.30769230769232H468" stroke="#e3e9ec"/><text x="46" y="113.308" text-anchor="end" fill="#183347">5</text><path d="M58,55.769230769230774H468" stroke="#e3e9ec"/><text x="46" y="61.769" text-anchor="end" fill="#183347">6</text><path d="M58,22V365H480" fill="none" stroke="#183347" stroke-width="1.8"/><text x="494" y="370" text-anchor="start" fill="#183347">x</text><text x="53" y="17" text-anchor="middle" fill="#183347">y</text><text x="46" y="391" text-anchor="middle" fill="#183347">0</text><g clip-path="url(#EMI001-6-clip)"><path d="M58,55.769 L247.231,365" fill="none" stroke="#26745f" stroke-width="2.8" /><path d="M58,55.769 L436.462,365" fill="none" stroke="#436f9c" stroke-width="2.8" /><path d="M58,158.846 L310.308,365" fill="none" stroke="#a96235" stroke-width="2.8" stroke-dasharray="7 5"/></g><circle cx="184.154" cy="261.923" r="4.5" fill="#183347" stroke="white" stroke-width="1.5"/><text x="174.154" y="247.923" text-anchor="end" fill="#183347">A(2,2)</text><circle cx="247.231" cy="313.462" r="4.5" fill="#183347" stroke="white" stroke-width="1.5"/><text x="257.231" y="301.462" text-anchor="start" fill="#183347">C(3,1)</text><circle cx="152.615" cy="133.077" r="4.5" fill="#183347" stroke="white" stroke-width="1.5"/><text x="162.615" y="121.077" text-anchor="start" fill="#183347">B(1.5,4.5)</text><text x="58" y="420">替代效应</text><path d="M184.15384615384616,414H247.23076923076925" stroke="#183347" stroke-width="2" marker-end="url(#EMI001-6-arrow)"/><text x="340" y="420">＋1</text><text x="58" y="455">收入效应</text><path d="M247.23076923076925,449H152.61538461538464" stroke="#183347" stroke-width="2" marker-end="url(#EMI001-6-arrow)"/><text x="340" y="455">−1.5</text><g font-size="14"><path d="M58,480H78" stroke="#26745f" stroke-width="3" /><text x="87" y="485">原预算：2x+y=6</text><path d="M58,503H78" stroke="#436f9c" stroke-width="3" /><text x="87" y="508">新预算：x+y=6</text><path d="M58,526H78" stroke="#a96235" stroke-width="3" stroke-dasharray="5 3"/><text x="87" y="531">Slutsky补偿线：x+y=4</text></g></g></svg>