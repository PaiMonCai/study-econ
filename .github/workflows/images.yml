name: Verify and publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json');if(process.env.RELEASE_TAG!=='v'+p.version)throw Error('Tag must match package version');"
      - run: npm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: selfhost-release
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-report
          path: test-results/
          if-no-files-found: ignore

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build on native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          native=$(uname -m)
          if [[ "$ARCH" == amd64 ]]; then [[ "$native" == x86_64 ]]; else [[ "$native" == aarch64 || "$native" == arm64 ]]; fi
          docker build --build-arg VCS_REF="$GITHUB_SHA" --build-arg VERSION="$(node -p 'require("./package.json").version')" -t study-econ:test .
      - name: Smoke test root and subdirectory containers
        run: node test-container.mjs
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture candidate
        if: github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="$image:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$ARCH"
          docker tag study-econ:test "$candidate"
          docker push "$candidate"

  publish:
    needs: [verify, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest and verify platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="$image:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            tags=(--tag "$image:$tag" --tag "$image:sha-$GITHUB_SHA-release")
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tags+=(--tag "$image:latest" --tag "$image:${tag%.*}")
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              echo 'Newer main exists; keeping dev on its newer publication.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            tags=(--tag "$image:dev" --tag "$image:sha-$GITHUB_SHA-dev")
          else
            echo 'Only main and version tags publish images.'
            exit 0
          fi
          docker buildx imagetools create "${tags[@]}" "$candidate-amd64" "$candidate-arm64"
          target="${tags[1]}"
          docker buildx imagetools inspect "$target" --raw > manifest.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64","linux/arm64"]' manifest.json
          docker buildx imagetools inspect "$target" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: selfhost-release
          path: release
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes "${args[@]}"
          fi
